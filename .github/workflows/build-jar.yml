# 自动构建：每次 push 到 main 自动创建 GitHub Prerelease 并上传 JAR。
# 规则：所有自动触发的 Release 均为 prerelease（tag 前缀 pre-）；
# 正式 release 只由人工在 GitHub Releases 页面手动发布（用正式 tag，如 1.20.1-x）。
name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            core/build/libs/
            advanced-solar-addon/build/libs/
            industrial-upgrade-addon/build/libs/

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: checkout for libs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            libs
          sparse-checkout-cone-mode: false
      - name: download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts
          path: build-output
      - name: filter mod jar
        run: |
          mkdir -p mod-release
          shopt -s globstar nullglob
          # 统一命名（与正式 release 对齐）：
          #   本体   industrialcraft2-refabricated-1.20.1-fabric.<ver>.jar
          #   ASA   advanced-solar-addon-fabric.<ver>.jar
          #   IU     industrial-upgrade-addon-fabric.<ver>.jar
          # 版本号从产物文件名提取（ic2_120-0.6.jar → 0.6）
          for f in build-output/**/ic2_120-*.jar; do
            [[ "$f" == *-sources* || "$f" == *-remapped* ]] && continue
            v=$(basename "$f" .jar); v="${v#ic2_120-}"
            [[ "$v" == *mc1.20.1* ]] && v="${v%-mc1.20.1}"
            cp "$f" "mod-release/industrialcraft2-refabricated-1.20.1-fabric.${v}.jar"
          done
          for f in build-output/**/ic2_120_advanced_solar_addon-*.jar; do
            [[ "$f" == *-sources* || "$f" == *-remapped* ]] && continue
            v=$(basename "$f" .jar); v="${v#ic2_120_advanced_solar_addon-}"
            [[ "$v" == *mc1.20.1* ]] && v="${v%-mc1.20.1}"
            cp "$f" "mod-release/advanced-solar-addon-fabric.${v}.jar"
          done
          for f in build-output/**/ic2_120_industrial_upgrade-*.jar; do
            [[ "$f" == *-sources* || "$f" == *-remapped* ]] && continue
            v=$(basename "$f" .jar); v="${v#ic2_120_industrial_upgrade-}"
            [[ "$v" == *mc1.20.1* ]] && v="${v%-mc1.20.1}"
            cp "$f" "mod-release/industrial-upgrade-addon-fabric.${v}.jar"
          done
          if [ -d "libs" ]; then
            cp libs/*.jar mod-release/ || true
          fi
          rm -f mod-release/energy-*.jar
          ls -l mod-release/
      - name: create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-1.20.1-${{ github.run_number }}
          files: mod-release/*.jar
          generate_release_notes: true
          prerelease: true
          make_latest: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
