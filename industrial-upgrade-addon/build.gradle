version = project.mod_version
group = project.maven_group

base {
	archivesName = "ic2_120_industrial_upgrade"
}

loom {
	mods {
		"ic2_120_industrial_upgrade" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

tasks.named('runDatagen') {
	jvmArgs '-Dfabric-api.datagen.modid=ic2_120_industrial_upgrade'
}

dependencies {
	implementation project(path: ":core", configuration: "namedElements")
	implementation project(path: ":advanced-solar-addon", configuration: "namedElements")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}
